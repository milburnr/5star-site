              - heading "Michael R." [level=3] [ref=e58]
              - paragraph [ref=e59]: Amarillo, TX
            - generic [ref=e60]:
              - generic [ref=e61]: ⭐⭐⭐⭐⭐
              - paragraph [ref=e62]: "2024"
          - paragraph [ref=e63]: "\"After the hailstorm last spring, I called several roofing companies but 5 Star was the only one who really took the time to document everything properly for insurance. They met with the adjuster, handled all the paperwork, and my claim was approved for the full amount. The new Class 4 shingles look great and I got a discount on my insurance premium. Highly recommend!\""
          - paragraph [ref=e64]: "Project: Hail Damage Roof Replacement"
        - generic [ref=e65]:
          - generic [ref=e66]:
            - generic [ref=e67]:
              - heading "Sarah T." [level=3] [ref=e68]
              - paragraph [ref=e69]: Midland, TX
            - generic [ref=e70]:
              - generic [ref=e71]: ⭐⭐⭐⭐⭐
              - paragraph [ref=e72]: "2024"
          - paragraph [ref=e73]: "\"We needed TPO roofing for our warehouse facility in Midland. 5 Star's team was professional, efficient, and completed the job ahead of schedule. The heat-welded seams are impressive - no leaks even during the heavy rains we had last month. Their understanding of commercial roofing for the oil & gas industry made a big difference.\""
          - paragraph [ref=e74]: "Project: Commercial TPO Roof Installation"
        - generic [ref=e75]:
          - generic [ref=e76]:
            - generic [ref=e77]:
              - heading "David L." [level=3] [ref=e78]
              - paragraph [ref=e79]: Canyon, TX
            - generic [ref=e80]:
              - generic [ref=e81]: ⭐⭐⭐⭐⭐
              - paragraph [ref=e82]: "2024"
          - paragraph [ref=e83]: "\"Best roofing experience I've ever had. They were honest about what needed to be repaired and what could wait. The crew showed up on time every day, cleaned up thoroughly, and the quality of work is excellent. Three months later and no issues whatsoever.\""
          - paragraph [ref=e84]: "Project: Asphalt Shingle Repair"
        - generic [ref=e85]:
          - generic [ref=e86]:
            - generic [ref=e87]:
              - heading "Jennifer M." [level=3] [ref=e88]
              - paragraph [ref=e89]: Odessa, TX
            - generic [ref=e90]:
              - generic [ref=e91]: ⭐⭐⭐⭐⭐
              - paragraph [ref=e92]: "2024"
          - paragraph [ref=e93]: "\"Our manufacturing plant needed urgent roof repairs after wind damage. 5 Star responded within hours and had temporary repairs done the same day to prevent water damage to our equipment. The permanent repair was completed quickly and their pricing was very fair. They understand that downtime costs us money.\""
          - paragraph [ref=e94]: "Project: Emergency Commercial Roof Repair"
        - generic [ref=e95]:
          - generic [ref=e96]:
            - generic [ref=e97]:
              - heading "Robert K." [level=3] [ref=e98]
              - paragraph [ref=e99]: Amarillo, TX
            - generic [ref=e100]:
              - generic [ref=e101]: ⭐⭐⭐⭐⭐
              - paragraph [ref=e102]: "2024"
          - paragraph [ref=e103]: "\"I was skeptical about metal roofing, but after seeing the hail damage on my neighbors' asphalt roofs every year, I decided to invest in standing seam metal. 5 Star educated me on all my options and the installation was flawless. It's been through two hailstorms already with zero damage. Worth every penny.\""
          - paragraph [ref=e104]: "Project: Standing Seam Metal Roof"
        - generic [ref=e105]:
          - generic [ref=e106]:
            - generic [ref=e107]:
              - heading "Amanda P." [level=3] [ref=e108]
              - paragraph [ref=e109]: Lubbock, TX
            - generic [ref=e110]:
              - generic [ref=e111]: ⭐⭐⭐⭐⭐
              - paragraph [ref=e112]: "2024"
          - paragraph [ref=e113]: "\"Free inspection after the storm, clear explanation of the damage, helped us file the insurance claim, and completed the work in just two days. Communication was excellent throughout the entire process. They even followed up a month later to make sure everything was still perfect.\""
          - paragraph [ref=e114]: "Project: Storm Damage Restoration"
        - generic [ref=e115]:
          - generic [ref=e116]:
            - generic [ref=e117]:
              - heading "James W." [level=3] [ref=e118]
              - paragraph [ref=e119]: Borger, TX
            - generic [ref=e120]:
              - generic [ref=e121]: ⭐⭐⭐⭐⭐
              - paragraph [ref=e122]: "2023"
          - paragraph [ref=e123]: "\"Had roof rot issues that several other contractors said wasn't covered by insurance. 5 Star's inspector found evidence that it was caused by previous hail damage and documented it properly. Insurance ended up covering the entire deck replacement. These guys know their stuff.\""
          - paragraph [ref=e124]: "Project: Roof Rot Repair & Deck Replacement"
        - generic [ref=e125]:
          - generic [ref=e126]:
            - generic [ref=e127]:
              - heading "Maria G." [level=3] [ref=e128]
              - paragraph [ref=e129]: Midland, TX
            - generic [ref=e130]:
              - generic [ref=e131]: ⭐⭐⭐⭐⭐
              - paragraph [ref=e132]: "2023"
          - paragraph [ref=e133]: "\"Our office building needed a complete roof replacement. 5 Star worked around our business hours to minimize disruption. The project manager kept us informed every step of the way. The new PVC roof looks great and we're already seeing lower cooling costs.\""
          - paragraph [ref=e134]: "Project: Commercial Roof Replacement"
        - generic [ref=e135]:
          - generic [ref=e136]:
            - generic [ref=e137]:
              - heading "Tom H." [level=3] [ref=e138]
              - paragraph [ref=e139]: Pampa, TX
            - generic [ref=e140]:
              - generic [ref=e141]: ⭐⭐⭐⭐⭐
              - paragraph [ref=e142]: "2023"
          - paragraph [ref=e143]: "\"Honest, reliable, and high quality work. They could have sold me on a full replacement but instead repaired the damaged sections and extended the life of my roof by 10+ years. That kind of integrity is rare these days.\""
          - paragraph [ref=e144]: "Project: Partial Roof Repair"
        - generic [ref=e145]:
          - generic [ref=e146]:
            - generic [ref=e147]:
              - heading "Lisa D." [level=3] [ref=e148]
              - paragraph [ref=e149]: Amarillo, TX
            - generic [ref=e150]:
              - generic [ref=e151]: ⭐⭐⭐⭐⭐
              - paragraph [ref=e152]: "2023"
          - paragraph [ref=e153]: "\"The attention to detail was impressive. They noticed and fixed ventilation issues I didn't even know I had, which has made a huge difference in my attic temperature. The crew was respectful, cleaned up daily, and the final result exceeded my expectations.\""
          - paragraph [ref=e154]: "Project: Residential Roof Replacement"

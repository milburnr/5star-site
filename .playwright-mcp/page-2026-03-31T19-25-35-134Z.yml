      - heading "Understanding Hail Damage Roofing in Amarillo" [level=2] [ref=e50]
      - generic [ref=e51]:
        - generic [ref=e52]:
          - heading "What Is Hail Damage Roof Repair?" [level=3] [ref=e53]
          - paragraph [ref=e54]: Hail damage roof repair is the process of restoring a roof after hailstones have compromised shingles, flashing, or underlayment. In West Texas, where severe storms frequently produce golf ball-sized hail or larger, repairs may range from replacing individual damaged shingles to full roof replacement. A professional inspection determines the extent of damage and appropriate repair scope.
        - generic [ref=e55]:
          - heading "What Is a Free Roof Inspection?" [level=3] [ref=e56]
          - paragraph [ref=e57]: A free roof inspection is a no-cost assessment performed by a licensed roofing contractor to evaluate your roof's condition after a storm. In Amarillo, Midland, and Odessa, reputable contractors document hail impacts, cracked shingles, and granule loss with photos and measurements. This documentation supports insurance claims and helps homeowners understand whether repairs are needed.
        - generic [ref=e58]:
          - heading "What Is a Class 4 Impact-Resistant Shingle?" [level=3] [ref=e59]
          - paragraph [ref=e60]: A Class 4 impact-resistant shingle is a roofing material rated to withstand the highest level of impact testing under UL 2218 standards. These shingles are engineered to resist cracking and splitting from hail up to 2 inches in diameter. Many Texas insurers offer premium discounts for Class 4 roofs, making them a practical choice for West Texas homeowners.
        - generic [ref=e61]:
          - heading "How the Roof Insurance Claim Process Works in Texas" [level=3] [ref=e62]
          - paragraph [ref=e63]: "The roof insurance claim process in Texas typically involves four steps: (1) document the damage with photos immediately after the storm, (2) contact your insurance company to file a claim, (3) schedule a professional roof inspection to assess full damage, and (4) meet with your insurance adjuster on-site. Your roofing contractor can provide documentation and communicate directly with your adjuster."
